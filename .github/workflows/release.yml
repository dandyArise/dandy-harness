name: Installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching tauri.conf.json
        required: true
        default: v0.1.0
      platform:
        description: Build all installers or retry one platform
        type: choice
        default: all
        options: [all, windows, linux, macos-arm64, macos-x64]
permissions:
  contents: read
concurrency:
  group: installers-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
            dict(key='windows', os='windows-latest', target='x86_64-pc-windows-msvc', bundles='nsis'),
            dict(key='macos-arm64', os='macos-15', target='aarch64-apple-darwin', bundles='dmg'),
            dict(key='macos-x64', os='macos-15-intel', target='x86_64-apple-darwin', bundles='dmg'),
            dict(key='linux', os='ubuntu-22.04', target='x86_64-unknown-linux-gnu', bundles='deb,appimage'),
          ]
          selected = [t for t in targets if os.environ['PLATFORM'] == 'all' or t['key'] == os.environ['PLATFORM']]
          assert selected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('targets=' + json.dumps(selected) + '\n')
          PY
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      DANDY_HARNESS_SOURCE: ${{ github.workspace }}/engine-source
      DSH_BUILD_CLIENT_PROFILE: local
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dandyArise/deepseek-harness
          ref: f0a26e7f33f5f69619c3793f61f2e4d6909ee3aa
          path: engine-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const c=require('./tauri.conf.json'); if(process.env.RELEASE_TAG !== 'v'+c.version) process.exit(1)"
      - name: Install engine dependencies
        working-directory: engine-source
        run: pnpm install --frozen-lockfile
      - name: Build engine
        working-directory: engine-source
        run: pnpm run build:artifacts
      - name: Pack engine and vendor
        run: node pack-engine.mjs engine-source
      - name: Prepare production runtime
        run: node prepare-engine.mjs engine-source target/engine-runtime
      - name: Install production dependencies
        working-directory: target/engine-runtime
        run: pnpm install --prod
      - name: Test isolated engine
        run: node smoke-engine.mjs target/engine-runtime
      - name: Filter Linux prebuilds
        if: runner.os == 'Linux'
        run: |
          node --test prune-linux-runtime.test.mjs
          node prune-linux-runtime.mjs target/engine-runtime
          node smoke-engine.mjs target/engine-runtime
      - name: Stage Node and resources
        run: node stage-release.mjs target/engine-runtime
      - name: Test launcher
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Lint launcher
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Build installers
        env:
          # linuxdeploy's bundled strip does not support all modern ELF sections.
          # https://github.com/tauri-apps/tauri/issues/14796
          NO_STRIP: 'true'
        run: pnpm dlx @tauri-apps/cli@2.12.6 build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config target/release-resources.json
      - name: Verify installed runtime
        run: node verify-installed.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
  publish:
    if: inputs.platform == 'all'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -eq 5
          # Keep checksum filenames identical to GitHub asset download names.
          for file in release-assets/*; do
            name="$(basename "$file")"
            normalized="${name// /-}"
            if [ "$name" != "$normalized" ]; then mv "$file" "release-assets/$normalized"; fi
          done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "Dandy Harness $RELEASE_TAG" --notes-file RELEASE.md --prerelease
